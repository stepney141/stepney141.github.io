<!DOCTYPE html>
<html lang="ja">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light dark">

        <title>stepney141 / Yumiya</title>
        <link rel="icon" href="favicon.png" type="image/png" />

        <meta name="twitter:card" content="summary">
        <meta property="og:title" content="stepney141's info" />
        <meta property="og:description" content="未知なるカダスを夢に求めて" />

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <main id="container"></main>
        <script type="module">
            import { marked } from "https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.esm.js";

            const response = await fetch("./index.md");
            if (!response.ok) {
                throw new Error(`index.md の取得に失敗しました: ${response.status}`);
            }
            document.querySelector("#container").innerHTML = marked.parse(await response.text());
        </script>
    </body>

</html>
